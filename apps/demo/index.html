<!doctype html>
<!--
  Japanese, because that is the template's default edition.

  What is written here is the pre-JavaScript state: the language, name and
  description a crawler reads, and what the tab says while the bundle is still
  loading. The template then writes all three itself on mount — to Japanese
  again for a first-time reader, or to English for one who has chosen it before
  — so this markup is the default rather than the whole answer. Keeping it in
  step with that default is what stops the tab from changing language a beat
  after the page opens.
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アストリクス — Astryx テンプレートのデモ</title>
    <meta
      name="description"
      content="Astryx の Information Maximalist ページテンプレートのデモです。検索マストヘッド、サービス一覧、分野別ニュース、天気、マーケット、アクセスランキングを一画面にならべた高密度ポータルの構成例（架空の内容）。" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
