name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a cancelled run
# would leave the live site on whichever commit happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install
        working-directory: demo
        run: npm ci

      - name: Typecheck
        working-directory: demo
        run: npm run typecheck

      - name: Lint
        working-directory: demo
        run: npm run lint

      # After the code gates, so a run that cannot compile does not reconfigure
      # the repository's Pages settings on its way to failing.
      #
      # `enablement: true` creates the Pages site on the first run if it does
      # not exist yet; where the workflow token is not allowed to do that, turn
      # Pages on once under Settings → Pages with "GitHub Actions" as the
      # source and this step then just reads the existing configuration.
      #
      # `base_path` is the base the demo build must use, read back from this
      # step so the repository name is not hard-coded in two places.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        working-directory: demo
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
