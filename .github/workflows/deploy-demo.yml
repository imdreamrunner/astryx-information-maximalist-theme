name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a cancelled run
# would leave the live site on whichever commit happened to finish last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before Node, because `setup-node`'s pnpm cache needs the pnpm
      # binary to resolve the store path.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # One install for the whole workspace: the root is itself a member (the
      # integration package), so this also links it into `apps/demo`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The demo renders the theme from TypeScript source, so nothing downstream
      # would notice an override the compiler rejects. Building the theme is
      # what turns that into a failing check.
      - name: Build theme
        run: pnpm run theme:build

      # Proves the integration still contributes what it claims: that the theme
      # catalog resolves and the template is discoverable through the package.
      - name: Verify integration contributions
        run: |
          pnpm run theme:list
          pnpm run template:list

      # After the code gates, so a run that cannot compile does not reconfigure
      # the repository's Pages settings on its way to failing.
      #
      # `enablement: true` creates the Pages site on the first run if it does
      # not exist yet; where the workflow token is not allowed to do that, turn
      # Pages on once under Settings → Pages with "GitHub Actions" as the
      # source and this step then just reads the existing configuration.
      #
      # `base_path` is the base the demo build must use, read back from this
      # step so the repository name is not hard-coded in two places.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build demo
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
